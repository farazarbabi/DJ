[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-tools"
version = "0.1.0"
description = "DJ music analysis, grouping, and recommendation tools"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10",
    "mutagen>=1.47",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
essentia = ["essentia>=2.1b6"]
clap = ["laion-clap>=1.0", "torch>=2.0"]
registry = ["httpx>=0.25", "lxml>=4.9", "python-dotenv>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
dj = "dj_tools.cli:main"
dj-tagger = "dj_tagger.cli:main"
dj-grouper = "dj_grouper.cli:main"
dj-registry = "dj_registry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
